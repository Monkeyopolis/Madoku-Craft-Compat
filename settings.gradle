pluginManagement {
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == 'net.fabricmc.fabric-loom-remap') {
				useModule('net.fabricmc:fabric-loom:1.17.20')
			}
		}
	}
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "madoku-craft-compat"

// Resolve the sibling Madoku modules as composite builds, matching the 26.2
// project. This keeps Compat running against the current module sources
// instead of silently falling back to stale Maven-local artifacts.
if (gradle.parent == null) {
	includeBuild("../core")
	includeBuild("../ecosystem")
	includeBuild("../attributes")
	includeBuild("../levels")
	includeBuild("../farming")
	includeBuild("../mobs")
	includeBuild("../pets")
	includeBuild("../items")
	includeBuild("../utility")
	includeBuild("../hud")
}
